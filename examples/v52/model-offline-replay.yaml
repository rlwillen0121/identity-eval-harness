# Offline replay config for IdentityBench v5.2. Contacts no provider and spends nothing.
# The runner asks the recording for the key `<episode_id>_r<repeat>_t<turn>`; a missing key is a
# provider failure, retried twice and then paused as INCOMPLETE_PROVIDER_FAILURE. With the empty
# recording every slot pauses before turn 1, which exercises the run, checkpoint, resume, and
# report paths end to end. Run from the repository root:
#   identitybench --no-env-file v52 run \
#     --config examples/v52/model-offline-replay.yaml \
#     --pricing examples/v52/pricing-synthetic-zero.json \
#     --suite v52_dev --out runs/v52/offline-replay
model:
  provider: replay
  model: offline-replay
  concurrency: 4
  extra:
    path: examples/v52/empty-responses.jsonl
