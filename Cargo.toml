[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "5.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/rlwillen0121/identity-eval-harness"
publish = false

[workspace.dependencies]
# Internal crates
ib-core = { path = "crates/ib-core" }
ib-accounting = { path = "crates/ib-accounting" }
ib-providers = { path = "crates/ib-providers" }
ib-v52-schemas = { path = "crates/ib-v52-schemas" }
ib-v52-engine = { path = "crates/ib-v52-engine" }
ib-v52-generator = { path = "crates/ib-v52-generator" }
ib-v52-runtime = { path = "crates/ib-v52-runtime" }

# Async / HTTP / Process / Files
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
tempfile = "3"
url = "2"
nix = { version = "0.32", features = ["signal", "user"] }

# Serialization. `arbitrary_precision` keeps Python big ints and float text intact through
# `serde_json::Value`; `preserve_order` mirrors Python dict insertion order for non-sorted dumps.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "float_roundtrip"] }
serde_norway = "0.9.42"
indexmap = { version = "2", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"
md-5 = "0.11"
zeroize = "1"

# Errors / CLI
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

# Text
aho-corasick = "1"
regex = "1"
regex-automata = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
