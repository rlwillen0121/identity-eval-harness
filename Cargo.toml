[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "5.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/rlwillen0121/identity-eval-harness"
publish = false

[workspace.dependencies]
# Internal crates
ib-core = { path = "crates/ib-core" }
ib-v5-schemas = { path = "crates/ib-v5-schemas" }
ib-v5-oracle = { path = "crates/ib-v5-oracle" }

# Serialization. `arbitrary_precision` keeps Python big ints and float text intact through
# `serde_json::Value`; `preserve_order` mirrors Python dict insertion order for non-sorted dumps.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"

# Errors / CLI
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

# Text
regex = "1"
tiktoken-rs = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
