# Dated public list prices in USD per 1M tokens (SPEC §11.4). Two uses:
#
# - metered API cost: a commercial API entry (provider kind `anthropic`, or `openai_compatible`
#   on OpenAI's endpoint) is billed from its row at run time. Self-hosted models cost $0 here,
#   and an access path that states each call's cost (a subscription CLI, a billing gateway)
#   records that figure instead: the runner never applies this table to it.
# - API-equivalent cost: the report prices a subscription CLI's recorded tokens at its model's
#   row (report.api_equivalent), labelled as such and never mixed into API cost, so a model run
#   through a subscription still gets a list-price figure.
#
# Fields per model:
#   input, output                 required
#   cache_read                    optional; defaults to 0.1 x input
#   cache_write_5m                optional; defaults to 1.25 x input
#   cache_write_1h                optional; defaults to 2 x input
#   long_context                  optional tier: when a call's prompt (input + cache read +
#                                 cache write tokens) exceeds threshold_tokens, the whole call
#                                 is billed at the tier's rates (same field rules and defaults)
#   as_of, source                 required: when and where the price was taken
#
# Only add a row when you have a dated price from the vendor or a catalog that lists the
# vendor's per-token price. Leave other vendors out otherwise.
#
# The six rows dated 2026-10-12 were taken from OpenRouter's public model catalog
# (https://openrouter.ai/api/v1/models, `pricing` per token x 1M), retrieved 2026-10-12 04:52
# UTC; the catalog id is in each row's source. The Claude rows agree with the Claude CLI's own
# per-call cost estimates on the v1 leaderboard run (every call, to the cent, with cache writes
# at the 1-hour rate), which also corrected Claude Sonnet 5.5's cache-read rate (0.10, not the
# 0.20 an earlier row had).

models:
  claude-fable-5-1:
    input: 10.00
    output: 50.00
    cache_read: 0.25
    as_of: 2026-10-06
    source: Anthropic API pricing (as cached 2026-10-06)

  claude-opus-5-5:
