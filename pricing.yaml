# Metered API prices in USD per 1M tokens (SPEC §11.4). Used for "metered API cost" only:
# self-hosted models cost $0 here, and CLI providers report their own cost per call.
#
# Fields per model:
#   input, output                 required
#   cache_read                    optional; defaults to 0.1 x input
#   cache_write_5m                optional; defaults to 1.25 x input
#   cache_write_1h                optional; defaults to 2 x input
#   long_context                  optional tier: when a call's prompt (input + cache read +
#                                 cache write tokens) exceeds threshold_tokens, the whole call
#                                 is billed at the tier's rates (same field rules and defaults)
#   as_of, source                 required: when and where the price was taken
#
# Only add a row when you have a dated, official price. Leave other vendors out otherwise.

models:
  claude-fable-5-1:
    input: 10.00
    output: 50.00
    cache_read: 0.25
    as_of: 2026-10-06
    source: Anthropic API pricing (as cached 2026-10-06)

  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    as_of: 2026-10-06
    source: Anthropic API pricing (as cached 2026-10-06)

  claude-sonnet-5-5:
