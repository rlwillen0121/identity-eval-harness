category: classification
spec_section: "SPEC-v3.md §3.1, §4.2 (Policy IGA-CLASS-002)"
scenarios:
  - scenario_id: CLASS-001
    description: "Active human primary workforce account resolved via hris_signal.employee_id (active_workload_manifest tier)"
    hris_records:
      usr_101:
        status: "active"
        department: "Engineering"
    account:
      account_id: "acc_cls_001"
      display_name: "Alice Rivera"
      email_or_spn: "alice.rivera@example.com"
      hris_signal:
        employee_id: "usr_101"
      idp_signal:
        mfa_enrolled: true
      cloud_iam_signal:
        oidc_federated: false
      vault_signal: {}
      cmdb_signal:
        active_deployment: false
        workload_manifest_id: null
      telemetry_signal:
        caller_type: "interactive"
      ticket_signal: {}
      expected_principal_kind: "human"
      expected_account_subkind: "human_primary"
      expected_subject_binding: "single_human"
      expected_accountability: "named_human_owner"
      expected_workload_binding: "unbound"
      expected_resolved_owner_id: "usr_101"
      expected_owner_resolution_source: "active_workload_manifest"
      expected_recommended_action: "BIND_OWNER"
      evidence_ids:
        - "EVID-CLS-001"

