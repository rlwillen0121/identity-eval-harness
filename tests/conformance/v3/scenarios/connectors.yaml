                entitlement_id: "ent_git_read"
                app_id: "app_github"
                name: "Git Read"
                privilege_tier: "low"
                grant_mode: "standing"
            owner_id: "usr_101"
            binding_type: "self"
          - id: "acc_102"
            principal_id: "usr_102"
            email: "bob@example.com"
            status: "active"
            account_type: "human_primary"
            department: "SRE"
