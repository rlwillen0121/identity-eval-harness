    privileged entitlement the new birthright doesn't". "Sources are judged on the move date:
    every source on file before the move takes effect that is live on or after the move date".
    §7.5: "An operation dated before the as-of date is a retroactive failure". §9.1: "one
    alternative claim set per fact-dependent part of the plan (each early removal, ...)".
