    - {entitlement_id: ent_crm_write, last_used_on: 2025-01-01}
  campaign: {items: [as_next, rm_crm]}
  expect:
    items:
      as_next: {decision: CERTIFY, near_miss: [HYG-001]}
      rm_crm: {decision: CERTIFY, near_miss: [HYG-001]}
