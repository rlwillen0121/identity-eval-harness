name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDENTITYBENCH_LIVE: "0"
  UV_FROZEN: "1"

jobs:
  test:
    name: lint, format, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy --strict src

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -p no:cacheprovider -q

  dataset:
    name: validate committed dataset
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate v4.1 sealed datasets and double-build
        run: |
          uv run identitybench v41 validate --suite v41_dev --double-build
          uv run identitybench v41 validate --suite v41_lite --double-build
          uv run identitybench v41 validate --suite v41_full --double-build
