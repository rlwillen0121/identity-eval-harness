name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDENTITYBENCH_LIVE: "0"

jobs:
  hygiene:
    name: Repository hygiene & site tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assert zero tracked Python files
        run: test -z "$(git ls-files '*.py')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify generated leaderboard data
        run: node site/build.mjs --check
      - name: Site JavaScript tests
        run: node --test "site/tests/*.test.mjs"

  rust-msrv:
    name: Rust minimum version (1.90.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Check workspace on minimum supported Rust
        run: cargo +1.90.0 check --workspace --locked

  rust:
    name: Rust v5 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust static checks
        run: cargo clippy --workspace --all-targets --locked

      - name: Build native ib-cli binary
        run: cargo build --locked -p ib-cli

      # Uses deterministic fixtures, mock endpoints and offline replay. No credentials.
      - name: Rust tests and executable workflows
        env:
          IDENTITYBENCH_CLI: ${{ github.workspace }}/target/debug/identitybench
        run: cargo test --workspace --locked

      - name: Validate sealed Draft 5 dev dataset and gate projection
        run: |
          validation="$RUNNER_TEMP/v5-dev-validation.json"
          set +e
          cargo run --locked -p ib-cli -- v5 validate --suite v5_dev --double-build > "$validation"
          validation_status=$?
          set -e
          node - "$validation" "$validation_status" <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const status = Number(process.argv[3]);
          if (status !== 1) {
            throw new Error(`expected exit 1 while G-SPEC-01 is stale; got ${status}`);
          }
          const passIds = [
            'G-SEAL-01', 'FIXTURE-CLOSURE-V5', 'G-SLICE-EXCLUSIVITY-01',
            'G-QUERY-01', 'G-TOK-01', 'G-DET-01', 'G-ORACLE-REPLAY-V5',
            'SCHEMA-INVENTORY-V5', 'G-IGA-REVIEW-01', 'NEGATIVE-MUTATION-V5',
            'G-BASE-01', 'G-TURN-01', 'G-NONINTERFERENCE-V5', 'G-DET-01',
          ];
          const liveIds = new Set(['G-ECON-01', 'G-CAL-01', 'G-CAL-02', 'G-CAL-03']);
          const expectedCounts = new Map();
          for (const id of [...passIds, 'G-SPEC-01', ...[...liveIds].sort()]) {
            expectedCounts.set(id, (expectedCounts.get(id) ?? 0) + 1);
          }
          const actualCounts = new Map();
          for (const gate of report.gate_results) {
            actualCounts.set(gate.gate_id, (actualCounts.get(gate.gate_id) ?? 0) + 1);
          }
          if (expectedCounts.size !== actualCounts.size ||
              [...expectedCounts].some(([k, v]) => actualCounts.get(k) !== v)) {
            throw new Error('missing, extra, or duplicated validation gates');
          }
          for (const gate of report.gate_results) {
            const id = gate.gate_id;
            const expected = liveIds.has(id) ? 'UNKNOWN' : (id === 'G-SPEC-01' ? 'FAIL' : 'PASS');
            if (gate.status !== expected) {
              throw new Error(`${id} must ${expected}: ${JSON.stringify(gate)}`);
            }
            if (id === 'G-SPEC-01' && !(gate.errors || []).join(' ').includes('receipt is stale or unrelated')) {
              throw new Error(`unexpected conformance failure: ${JSON.stringify(gate)}`);
            }
          }
          console.log('v5_dev seal and offline source gates pass; stale G-SPEC-01 remains FAIL');
          console.log(`live-evidence gates remain UNKNOWN: ${[...liveIds].sort().join(', ')}`);
          JS
