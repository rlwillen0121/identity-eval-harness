name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDENTITYBENCH_LIVE: "0"

jobs:
  hygiene:
    name: Repository hygiene & site tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assert zero tracked Python files
        run: test -z "$(git ls-files '*.py')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify generated leaderboard data
        run: node site/build.mjs --check
      - name: Site JavaScript tests
        run: node --test "site/tests/*.test.mjs"

  rust-msrv:
    name: Rust minimum version (1.90.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Check workspace on minimum supported Rust
        run: cargo +1.90.0 check --workspace --locked

  rust:
    name: Rust v5.2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust static checks
        run: cargo clippy --workspace --all-targets --locked

      - name: Build native ib-cli binary
        run: cargo build --locked -p ib-cli

      # Uses deterministic fixtures, temporary datasets, and offline replay. No credentials.
      - name: Rust tests and executable workflows
        run: cargo test --workspace --locked

      # Public suites only: v52_core and v52_full are private and never committed (SPEC-v5.2 §2.2).
      - name: Validate sealed v5.2 public datasets with double build
        run: |
          cargo build --release --locked -p ib-cli
          for suite in v52_dev:12 v52_lite:24 v52_blind_fixture:48; do
            name="${suite%%:*}"
            count="${suite##*:}"
            validation="$RUNNER_TEMP/${name}-validation.json"
            set +e
            ./target/release/identitybench v52 validate --suite "$name" --double-build > "$validation"
            validation_status=$?
            set -e
            node - "$validation" "$validation_status" "$name" "$count" <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const status = Number(process.argv[3]);
          const suite = process.argv[4];
          const count = Number(process.argv[5]);
          if (status !== 0) {
            throw new Error(`expected exit 0 from v52 validate on ${suite}; got ${status}: ${JSON.stringify(report.gates)}`);
          }
          const expected = [
            'G-SEAL-V52',
            'G-GOLD-REPLAY-V52',
            'G-ANTI-ORACLE-V52',
            'G-BASELINE-V52',
            'G-ARTIFACT-BUDGET-V52',
            'G-DET-V52',
          ];
          const actual = report.gates.map((gate) => gate.gate_id);
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`unexpected gate set on ${suite}: ${JSON.stringify(actual)}`);
          }
          for (const gate of report.gates) {
            if (gate.passed !== true) {
              throw new Error(`${gate.gate_id} must pass on ${suite}: ${JSON.stringify(gate)}`);
            }
          }
          if (report.passed !== true || report.suite_id !== suite || report.episode_count !== count) {
            throw new Error(`${suite} must pass with ${count} episodes: ${JSON.stringify(report.gates)}`);
          }
          // G-PARITY-V52 stays pending until the Phase-2 transcript renderer is registered.
          const pending = report.pending_gates.map((gate) => gate.gate_id);
          const ceiling = report.baselines.shortcut_ceiling;
          console.log(`${suite}: ${expected.join(', ')} pass; pending: ${pending.join(', ') || 'none'}; shortcut ceiling State-Acc=${ceiling.state_acc.toFixed(4)} Macro-Cat-Acc=${ceiling.macro_cat_acc.toFixed(4)}`);
          JS
          done
