name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDENTITYBENCH_LIVE: "0"

jobs:
  hygiene:
    name: Repository hygiene & site tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assert zero tracked Python files
        run: test -z "$(git ls-files '*.py')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify generated leaderboard data
        run: node site/build.mjs --check
      - name: Site JavaScript tests
        run: node --test "site/tests/*.test.mjs"

  rust-msrv:
    name: Rust minimum version (1.90.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Check workspace on minimum supported Rust
        run: cargo +1.90.0 check --workspace --locked

  rust:
    name: Rust v5.1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust static checks
        run: cargo clippy --workspace --all-targets --locked

      - name: Build native ib-cli binary
        run: cargo build --locked -p ib-cli

      # Uses deterministic fixtures, temporary datasets, and offline replay. No credentials.
      - name: Rust tests and executable workflows
        run: cargo test --workspace --locked

      - name: Validate sealed v5.1 dev dataset with double build
        run: |
          validation="$RUNNER_TEMP/v51-dev-validation.json"
          set +e
          cargo run --locked -p ib-cli -- v51 validate --suite v51_dev --double-build > "$validation"
          validation_status=$?
          set -e
          node - "$validation" "$validation_status" <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const status = Number(process.argv[3]);
          if (status !== 0) {
            throw new Error(`expected exit 0 from v51 validate; got ${status}: ${JSON.stringify(report)}`);
          }
          const expected = ['G-SEAL-V51', 'G-GOLD-REPLAY-V51', 'G-ANTI-ORACLE-V51', 'G-DET-V51'];
          const actual = report.gates.map((gate) => gate.gate_id);
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`unexpected gate set: ${JSON.stringify(actual)}`);
          }
          for (const gate of report.gates) {
            if (gate.passed !== true) {
              throw new Error(`${gate.gate_id} must pass: ${JSON.stringify(gate)}`);
            }
          }
          if (report.passed !== true || report.episode_count !== 12) {
            throw new Error(`v51_dev must pass with 12 episodes: ${JSON.stringify(report)}`);
          }
          console.log(`v51_dev seal, gold replay, anti-oracle, and double-build determinism pass: ${expected.join(', ')}`);
          JS
