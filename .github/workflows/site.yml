# Checks for the leaderboard site. Cloudflare Workers Builds deploys site/ on push to main
# (see site/wrangler.jsonc); this workflow is the gate that keeps a broken site out of main.
name: Site checks

on:
  push:
    paths:
      - "site/**"
      - "reports/v51/runs/**"
      - "archive/datasets/v51/v51_core/SEAL.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "reports/v51/runs/**"
      - "archive/datasets/v51/v51_core/SEAL.json"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify static v4.1 site snapshot
        run: node -e "const fs=require('fs');for (const f of ['site/data/leaderboard.json','site/data/history.json']) JSON.parse(fs.readFileSync(f,'utf8'));for (const f of ['site/index.html','site/assets/scripts/main.js']) if(!fs.existsSync(f)) throw new Error(f);console.log('static v4.1 snapshot OK')"
