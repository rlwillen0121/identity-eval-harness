# Checks for the leaderboard site. Cloudflare Workers Builds deploys site/ on push to main
# (see site/wrangler.jsonc); this workflow is the gate that keeps a broken site out of main.
name: Site checks

on:
  push:
    paths:
      - "site/**"
      - "scripts/import-v53-run.mjs"
      - "reports/v53/**"
      - "datasets/v53/v53_core/SEAL.json"
      - "datasets/v53/v53_full/SEAL.json"
      - "datasets/v53/PRECOMMIT.json"
      - "pricing/v53-pricing-table.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/import-v53-run.mjs"
      - "reports/v53/**"
      - "datasets/v53/v53_core/SEAL.json"
      - "datasets/v53/v53_full/SEAL.json"
      - "datasets/v53/PRECOMMIT.json"
      - "pricing/v53-pricing-table.json"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify v5.3 site build and run JS tests
        run: |
          node site/build.mjs --check
          node --test "site/tests/*.test.mjs"
